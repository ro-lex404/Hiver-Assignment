name: Kaggle Kernel Sync & Cloud Execution

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - 'src/**'

jobs:
  sync-kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          pip install kaggle

      - name: Push Kernel to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python scripts/kaggle_push.py
